name: Mirror Alpine to GHCR

on:
  push:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * 1"

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy alpine:3.24 to GHCR
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/alpine:3.24 \
            alpine:3.24
