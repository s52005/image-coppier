name: Mirror images to GHCR

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "README.md"
  schedule:
    - cron: "0 3 * * 0,1,3,5"

permissions:
  contents: write
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: nginx:1.31
            target: ghcr.io/${{ github.repository_owner }}/mirror/nginx
            tag: 1.31
          - source: alpine:3.24
            target: ghcr.io/${{ github.repository_owner }}/mirror/alpine
            tag: 3.24
          - source: gitea/gitea:1.27-rootless
            target: ghcr.io/${{ github.repository_owner }}/mirror/gitea/gitea
            tag: 1.27-rootless
          - source: gitea/runner:5
            target: ghcr.io/${{ github.repository_owner }}/mirror/gitea/runner
            tag: 5
          - source: gitea/runner-images:ubuntu-latest
            target: ghcr.io/${{ github.repository_owner }}/mirror/gitea/runner-images
            tag: ubuntu-latest
          - source: gitea/runner-images:ubuntu-24.04
            target: ghcr.io/${{ github.repository_owner }}/mirror/gitea/runner-images
            tag: ubuntu-24.04
          - source: moby/buildkit:buildx-stable-1
            target: ghcr.io/${{ github.repository_owner }}/mirror/moby/buildkit
            tag: buildx-stable-1
          - source: moby/buildkit:latest
            target: ghcr.io/${{ github.repository_owner }}/mirror/moby/buildkit
            tag: latest
          - source: python:3.15-alpine3.24
            target: ghcr.io/${{ github.repository_owner }}/mirror/python
            tag: 3.15-alpine3.24
          - source: ubuntu:24.04
            target: ghcr.io/${{ github.repository_owner }}/mirror/ubuntu
            tag: 24.04
          - source: gotify/server:3
            target: ghcr.io/${{ github.repository_owner }}/mirror/gotify/server
            tag: 3
          - source: node:26
            target: ghcr.io/${{ github.repository_owner }}/mirror/node
            tag: 26
          - source: node:26-alpine3.24
            target: ghcr.io/${{ github.repository_owner }}/mirror/node
            tag: 26-alpine3.24
          - source: screego/server:1
            target: ghcr.io/${{ github.repository_owner }}/mirror/screego/server
            tag: 1
          - source: jekyll/jekyll:4
            target: ghcr.io/${{ github.repository_owner }}/mirror/jekyll/jekyll
            tag: 4
          - source: mongo:9.0
            target: ghcr.io/${{ github.repository_owner }}/mirror/mongo:9.0
            tag: 9.0
          - source: scylladb/scylla:2026.3
            target: ghcr.io/${{ github.repository_owner }}/mirror/scylladb/scylla:2026.3
            tag: 2026.3
          - source: postgres:17-alpine3.23
            target: ghcr.io/${{ github.repository_owner }}/mirror/postgres:17-alpine3.23
            tag: 17-alpine3.23
          - source: redis:8.8.3-alpine3.23
            target: ghcr.io/${{ github.repository_owner }}/mirror/redis:8.8.3-alpine3.23
            tag: 8.8.3-alpine3.23
          - source: grafana/grafana:13.0-slim
            target: ghcr.io/${{ github.repository_owner }}/mirror/grafana/grafana:13.0-slim
            tag: 13.0-slim
          - source: prom/prometheus:v3
            target: ghcr.io/${{ github.repository_owner }}/mirror/prom/prometheus:v3
            tag: v3
          - source: dbgate/dbgate:7.3.2-alpine
            target: ghcr.io/${{ github.repository_owner }}/mirror/dbgate/dbgate:7.3.2-alpine
            tag: 7.3.2-alpine

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image
        run: |
          docker buildx imagetools create \
            --platform linux/amd64,linux/arm64 \
            -t ${{ matrix.target }}:${{ matrix.tag }} \
            ${{ matrix.source }}

  update-check-file:
    runs-on: ubuntu-latest
    needs: mirror

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update last checked file
        run: |
          TZ="${{ vars.TZ }}" date '+%Y-%m-%d %H:%M:%S %Z' > last-checked

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-checked
          git commit -m "Update mirror check time" || exit 0
          git push
