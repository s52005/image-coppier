name: Mirror images to GHCR

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "README.md"
  schedule:
    - cron: "0 3 * * 0,1,3,5"

permissions:
  contents: write
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: nginx
            target: ghcr.io/${{ github.repository_owner }}/mirror/nginx
            tag: 1.31
          - source: alpine
            target: ghcr.io/${{ github.repository_owner }}/mirror/alpine
            tag: 3.24
          - source: gitea/gitea
            target: ghcr.io/${{ github.repository_owner }}/mirror/gitea/gitea
            tag: 1.27-rootless
          - source: gitea/runner
            target: ghcr.io/${{ github.repository_owner }}/mirror/gitea/runner
            tag: 5
          - source: gitea/runner-images
            target: ghcr.io/${{ github.repository_owner }}/mirror/gitea/runner-images
            tag: ubuntu-latest
          - source: gitea/runner-images
            target: ghcr.io/${{ github.repository_owner }}/mirror/gitea/runner-images
            tag: ubuntu-24.04
          - source: moby/buildkit
            target: ghcr.io/${{ github.repository_owner }}/mirror/moby/buildkit
            tag: buildx-stable-1
          - source: moby/buildkit
            target: ghcr.io/${{ github.repository_owner }}/mirror/moby/buildkit
            tag: latest
          - source: python
            target: ghcr.io/${{ github.repository_owner }}/mirror/python
            tag: 3.15-alpine3.24
          - source: ubuntu
            target: ghcr.io/${{ github.repository_owner }}/mirror/ubuntu
            tag: 24.04
          - source: gotify/server
            target: ghcr.io/${{ github.repository_owner }}/mirror/gotify/server
            tag: 3
          - source: node
            target: ghcr.io/${{ github.repository_owner }}/mirror/node
            tag: 26
          - source: node
            target: ghcr.io/${{ github.repository_owner }}/mirror/node
            tag: 26-alpine3.24
          - source: screego/server
            target: ghcr.io/${{ github.repository_owner }}/mirror/screego/server
            tag: 1
          - source: jekyll/jekyll
            target: ghcr.io/${{ github.repository_owner }}/mirror/jekyll/jekyll
            tag: 4
          - source: mongo
            target: ghcr.io/${{ github.repository_owner }}/mirror/mongo
            tag: 9.0
          - source: scylladb/scylla
            target: ghcr.io/${{ github.repository_owner }}/mirror/scylladb/scylla
            tag: 2026.3
          - source: postgres
            target: ghcr.io/${{ github.repository_owner }}/mirror/postgres
            tag: 17-alpine3.23
          - source: redis
            target: ghcr.io/${{ github.repository_owner }}/mirror/redis
            tag: 8.8.3-alpine3.23
          - source: grafana/grafana
            target: ghcr.io/${{ github.repository_owner }}/mirror/grafana/grafana
            tag: 13.0-slim
          - source: prom/prometheus
            target: ghcr.io/${{ github.repository_owner }}/mirror/prom/prometheus
            tag: v3
          - source: dbgate/dbgate
            target: ghcr.io/${{ github.repository_owner }}/mirror/dbgate/dbgate
            tag: 7.3.2-alpine
          - source: tonistiigi/binfmt
            target: ghcr.io/${{ github.repository_owner }}/mirror/tonistiigi/binfmt
            tag: latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image
        run: |
          docker buildx imagetools create \
            --platform linux/amd64,linux/arm64 \
            -t ${{ matrix.target }}:${{ matrix.tag }} \
            ${{ matrix.source }}:${{ matrix.tag }}

  update-check-file:
    runs-on: ubuntu-latest
    needs: mirror

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Update last checked file
        run: |
          TZ="${{ vars.TZ }}" date '+%Y-%m-%d %H:%M:%S %Z' > last-checked

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-checked
          git commit -m "Update mirror check time" || exit 0
          git push
